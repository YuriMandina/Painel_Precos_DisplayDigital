{% extends "painel/base_dashboard.html" %}

{% block title %}Excluir Produto | DisplayDigital{% endblock %}

{% block content %}
<main class="min-h-[60vh] flex items-center justify-center p-4">
    <div class="bg-white border border-gray-200 rounded-xl shadow-xl max-w-md w-full overflow-hidden text-center p-8">
        
        <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6 ring-4 ring-red-50/50">
            <i class="ph-fill ph-trash text-3xl"></i>
        </div>
        
        <h1 class="text-xl font-bold text-gray-900 mb-2">Confirmar Exclusão</h1>
        
        <p class="text-gray-500 mb-8 leading-relaxed">
            Você está prestes a remover o produto <br>
            <strong class="text-gray-900">"{{ object.descricao }}"</strong>.
            <br><span class="text-red-500 text-sm">Esta ação não poderá ser desfeita.</span>
        </p>

        <form method="post" class="flex flex-col sm:flex-row gap-3 justify-center">
            {% csrf_token %}
            
            <a href="{% url 'produtos_list' %}" 
               class="flex-1 px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                Cancelar
            </a>
            
            <button type="submit" 
                    class="flex-1 px-5 py-2.5 text-sm font-bold text-white bg-red-600 rounded-lg hover:bg-red-700 shadow-md hover:shadow-lg transition-all">
                Sim, Excluir
            </button>
        </form>
    </div>
</main>
{% endblock %}
