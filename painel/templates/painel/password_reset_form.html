<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | DisplayDigital</title>
    {% load tailwind_cli static %}
    {% tailwind_css %}
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Outfit', sans-serif; }</style>
</head>
<body class="bg-white dark:bg-slate-900 min-h-screen flex text-slate-800 dark:text-slate-200">
    <!-- Left Pane - Branding -->
    <div class="hidden lg:flex lg:w-1/2 relative bg-indigo-900 overflow-hidden items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-600 to-purple-900 opacity-90"></div>
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-purple-500 blur-3xl opacity-30"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] rounded-full bg-indigo-400 blur-3xl opacity-20 translate-x-1/3 translate-y-1/3"></div>
        <div class="relative z-10 text-center px-12">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-white dark:bg-slate-900/10 backdrop-blur-md text-white shadow-xl mb-8 border border-white/20">
                <i class="ph-fill ph-monitor-play text-5xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-white tracking-tight mb-4">DISPLAY<span class="text-indigo-300">DIGITAL</span></h1>
            <p class="text-lg text-indigo-100 max-w-md mx-auto">Transforme suas telas em painéis de preço inteligentes e aumente suas vendas.</p>
        </div>
    </div>
    <!-- Right Pane - Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12">
        <div class="w-full max-w-md">
            <a href="{% url 'login' %}" class="inline-flex items-center text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-indigo-600 mb-8 transition-colors">
                <i class="ph-bold ph-arrow-left mr-2"></i> Voltar para o login
            </a>
            <div class="mb-10 text-center lg:text-left">
                <h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Esqueceu a senha?</h2>
                <p class="text-slate-500 dark:text-slate-400">Informe seu e-mail abaixo e enviaremos instruções para redefinir sua senha.</p>
            </div>
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="id_email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">E-mail Cadastrado</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none transition-colors group-focus-within:text-indigo-600 text-slate-400">
                            <i class="ph-bold ph-envelope-simple text-lg"></i>
                        </div>
                        <input type="email" name="email" id="id_email" required
                               class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-600 focus:border-transparent sm:text-sm transition-colors"
                               placeholder="seu@email.com">
                    </div>
                </div>
                <button type="submit" 
                        class="w-full flex justify-center items-center gap-2 py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-600/20 shadow-lg shadow-indigo-600/30 transition-all hover:-translate-y-0.5 mt-8">
                    Enviar Link de Recuperação <i class="ph-bold ph-paper-plane-right"></i>
                </button>
            </form>
        </div>
    </div>
    <script src="{% static 'painel/js/prevent_double_submit.js' %}"></script>
</body>
</html>
