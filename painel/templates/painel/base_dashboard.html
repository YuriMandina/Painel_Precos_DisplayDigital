<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Painel Administrativo | DisplayDigital{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Utilitário para ocultar a barra de rolagem mas manter funcionalidade */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #374151; border-radius: 20px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <aside id="sidebar" class="w-64 bg-gray-900 text-white flex flex-col shadow-2xl z-30 transition-transform transform -translate-x-full md:translate-x-0 md:flex fixed md:relative h-full">
        
        <div class="h-20 flex items-center px-6 border-b border-gray-800 flex-shrink-0">
            <div class="flex items-center gap-2 text-xl font-bold tracking-tight">
                <i class="ph-fill ph-monitor-play text-indigo-500 text-2xl"></i>
                <div>
                    <span class="text-white">DISPLAY</span><span class="text-indigo-500">DIGITAL</span>
                </div>
            </div>
            <button id="closeSidebar" class="md:hidden ml-auto text-gray-400 hover:text-white">
                <i class="ph ph-x text-xl"></i>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-6 px-3 custom-scrollbar space-y-1">
            
            <p class="px-4 mt-2 mb-3 text-xs font-bold text-gray-500 uppercase tracking-wider">
                Principal
            </p>

            <a href="{% url 'dashboard' %}" 
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors
               {% if request.resolver_match.url_name == 'dashboard' %}bg-indigo-600 text-white shadow-lg shadow-indigo-500/30{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
                <i class="ph ph-squares-four text-lg"></i>
                <span>Visão Geral</span>
            </a>

            <a href="{% url 'dispositivo_list' %}" 
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors
               {% if 'dispositivo' in request.resolver_match.url_name %}bg-indigo-600 text-white shadow-lg shadow-indigo-500/30{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
                <i class="ph ph-television text-lg"></i>
                <span>Dispositivos</span>
            </a>

            <p class="px-4 mt-6 mb-3 text-xs font-bold text-gray-500 uppercase tracking-wider">
                Catálogo
            </p>
            
            <a href="{% url 'produtos_list' %}" 
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors
               {% if 'produto' in request.resolver_match.url_name %}bg-indigo-600 text-white shadow-lg shadow-indigo-500/30{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
                <i class="ph ph-tag text-lg"></i>
                <span>Produtos</span>
            </a>
            
            <a href="{% url 'familia_list' %}" 
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors
               {% if 'familia' in request.resolver_match.url_name %}bg-indigo-600 text-white shadow-lg shadow-indigo-500/30{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
                <i class="ph ph-folders text-lg"></i>
                <span>Famílias</span>
            </a>

            <p class="px-4 mt-6 mb-3 text-xs font-bold text-gray-500 uppercase tracking-wider">
                Mídia
            </p>

            <a href="#" 
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors
               {% if 'propaganda' in request.resolver_match.url_name %}bg-indigo-600 text-white shadow-lg shadow-indigo-500/30{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
                <i class="ph ph-film-strip text-lg"></i>
                <span>Propagandas</span>
            </a>

            <a href="{% url 'template_list' %}" 
               class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors
               {% if 'template' in request.resolver_match.url_name %}bg-indigo-600 text-white shadow-lg shadow-indigo-500/30{% else %}text-gray-400 hover:bg-gray-800 hover:text-white{% endif %}">
                <i class="ph ph-paint-brush-broad text-lg"></i>
                <span>Templates</span>
            </a>
        </nav>

        <div class="p-4 border-t border-gray-800 bg-gray-900 flex-shrink-0">
            <a href="/admin/logout/" class="flex items-center justify-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-red-400 hover:bg-red-900/20 hover:text-red-300 transition-colors">
                <i class="ph ph-sign-out text-lg"></i>
                <span>Sair do Sistema</span>
            </a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative w-full">
        
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 md:hidden flex-shrink-0 z-20">
            <div class="font-bold text-gray-900 flex items-center gap-2">
                <i class="ph-fill ph-monitor-play text-indigo-600 text-xl"></i>
                <span>DISPLAYDIGITAL</span>
            </div>
            <button id="openSidebar" class="text-gray-500 hover:text-indigo-600 p-2 rounded-md focus:outline-none">
                <i class="ph ph-list text-2xl"></i>
            </button>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6 md:p-10 scroll-smooth">
            
            {% if messages %}
                <div class="mb-8 space-y-3 max-w-7xl mx-auto">
                    {% for message in messages %}
                        <div class="p-4 rounded-lg border-l-4 shadow-sm flex items-center gap-3 text-sm
                            {% if message.tags == 'error' %} bg-red-50 border-red-500 text-red-700
                            {% elif message.tags == 'success' %} bg-green-50 border-green-500 text-green-700
                            {% else %} bg-blue-50 border-blue-500 text-blue-700 {% endif %}">
                            
                            <i class="ph-fill text-xl 
                                {% if message.tags == 'error' %} ph-warning-circle
                                {% elif message.tags == 'success' %} ph-check-circle
                                {% else %} ph-info {% endif %}">
                            </i>
                            <span class="font-medium">{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="max-w-7xl mx-auto">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden glass"></div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const openBtn = document.getElementById('openSidebar');
        const closeBtn = document.getElementById('closeSidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            // Remove/Adiciona classe de translação para mostrar/esconder
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        openBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
