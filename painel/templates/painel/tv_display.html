{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Digital | Display</title>
    
    <link rel="stylesheet" href="{% static 'css/painel.css' %}?v={% now 'U' %}">

    <style>
        /* Estilos Base para Modo Kiosk (TV) */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            cursor: none; 
            font-family: sans-serif;
        }

        /* Estilos da Tela de Configuração (Pareamento) */
        #setup-screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            background: #1a1a1a;
            text-align: center;
            cursor: default; 
        }

        #setup-screen h1 { margin-bottom: 1rem; font-size: 2rem; }
        #setup-screen p { margin-bottom: 1.5rem; color: #ccc; }

        #input-uuid {
            padding: 15px;
            font-size: 1.2rem;
            width: 60%;
            max-width: 500px;
            border: 2px solid #333;
            border-radius: 8px;
            background: #333;
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }
        
        #input-uuid:focus { border-color: #4F46E5; }

        #btn-salvar {
            padding: 15px 40px;
            font-size: 1.2rem;
            background-color: #4F46E5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        #btn-salvar:hover { background-color: #4338ca; }
    </style>
</head>
<body>

    <section id="setup-screen">
        <h1>Configuração da TV</h1>
        <p>Digite o UUID do dispositivo gerado no Painel Administrativo:</p>
        
        <input type="text" 
               id="input-uuid" 
               placeholder="ex: 550e8400-e29b..." 
               autocomplete="off">
               
        <button id="btn-salvar">CONECTAR DISPOSITIVO</button>
    </section>

    <main class="tv-wrapper" id="app-screen" style="display:none;">
        <header class="painel-header">
            <h1 class="painel-titulo" id="titulo-painel">Carregando...</h1>
        </header>

        <div class="painel-conteudo" id="painel-conteudo"></div>
        
        <div id="video-overlay-container"></div>
    </main>

    <script src="{% static 'js/tv_app.js' %}?v={% now 'U' %}" defer></script>
</body>
</html>
