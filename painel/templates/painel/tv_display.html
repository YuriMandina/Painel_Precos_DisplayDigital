{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <!-- Libera autoplay e mídia do Cloudinary sem prompts do browser -->
    <meta http-equiv="Feature-Policy" content="autoplay *; fullscreen *">
    <!-- CSP: permite carregar mídia do Cloudinary e fontes do Google -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline'; 
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
                   font-src 'self' https://fonts.gstatic.com; 
                   img-src 'self' data: https://res.cloudinary.com blob:; 
                   media-src 'self' https://res.cloudinary.com blob:;
                   connect-src 'self';">
    <title>Painel Digital | Display</title>
    
    <link rel="stylesheet" href="{% static 'css/painel.css' %}?v={% now 'U' %}">

    <style>
        /* ==========================================================================
                                        DOM / KIOSK RESET
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            user-select: none;
            cursor: none; 
            font-family: 'Outfit', sans-serif;
        }

        /* ==========================================================================
                                        VÍDEO — CONTROLES OCULTOS
           Garante que NENHUM controle nativo apareça na TV em modo kiosk.
           Funciona no Chrome, SamsungBrowser/Tizen e WebOS.
           ========================================================================== */
        video::-webkit-media-controls             { display: none !important; }
        video::-webkit-media-controls-enclosure   { display: none !important; }
        video::-webkit-media-controls-panel       { display: none !important; }
        video::-webkit-media-controls-play-button { display: none !important; }
        video::-webkit-media-controls-timeline    { display: none !important; }
        video::-webkit-media-controls-current-time-display { display: none !important; }
        video::-webkit-media-controls-time-remaining-display { display: none !important; }
        video::-webkit-media-controls-mute-button { display: none !important; }
        video::-webkit-media-controls-volume-slider { display: none !important; }
        video::-webkit-media-controls-fullscreen-button { display: none !important; }
        video { pointer-events: none; }

        /* ==========================================================================
                                        SETUP COMPONENT
           ========================================================================== */
        #setup-screen {
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            color: white;
            background: radial-gradient(circle at center, #1e1b4b 0%, #000000 100%);
            text-align: center;
            cursor: default; 
            position: absolute;
            top: 0; left: 0;
            z-index: 9999;
        }

        .setup-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 4rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .setup-logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin-bottom: 2rem;
        }
        .setup-logo span {
            color: #6366f1;
        }

        #setup-screen h1 { 
            margin: 0 0 1rem 0; 
            font-size: 2.5rem; 
            font-weight: 600;
        }
        
        #setup-screen p { 
            margin: 0 0 2.5rem 0; 
            color: #94a3b8; 
            font-size: 1.1rem;
            line-height: 1.5;
        }

        #input-uuid {
            padding: 1rem 2rem;
            font-size: 2rem;
            letter-spacing: 0.2em;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        #input-uuid:focus { 
            border-color: #6366f1; 
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        #btn-salvar {
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4);
        }

        #btn-salvar:hover { 
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.5);
        }

        #btn-salvar:active {
            transform: translateY(0);
        }
    </style>
    <!-- Add Outfit font for the setup screen -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <section id="setup-screen">
        <div class="setup-card">
            <div class="setup-logo">DISPLAY<span>DIGITAL</span></div>
            <h1>Conectar Tela</h1>
            <p>Acesse o painel no seu computador ou celular, vá em Dispositivos e digite o código abaixo.</p>
            
            <input type="text" 
                   id="input-uuid" 
                   placeholder="CÓDIGO" 
                   autocomplete="off"
                   maxlength="6">
                   
            <button id="btn-salvar">Conectar Dispositivo</button>
        </div>
    </section>

    <main class="tv-wrapper" id="app-screen" style="display:none;">
        
        <header class="painel-header">
            <h1 class="painel-titulo" id="titulo-painel">Carregando...</h1>
        </header>

        <div class="painel-conteudo" id="painel-conteudo"></div>
        
        <div id="video-overlay-container"></div>
        
    </main>

    <script src="{% static 'js/tv_app.js' %}?v={% now 'U' %}" defer></script>

</body>
</html>
