upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name displaydigital.duckdns.org 45.234.92.169;
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name displaydigital.duckdns.org;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/displaydigital.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/displaydigital.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
